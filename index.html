<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pruebas Trimestrales 12°</title>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px 10px 20px;
      background-color: #107c65;
    }

    header img {
      height: 100px;
      margin-bottom: 15px;
    }

    .titles {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }

    .titles h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #2ba98e;
    }

    .titles h2 {
      font-size: 1.4rem;
      color: #3a3a3a;
    }

    .section-title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      margin-top: 40px;
      margin-bottom: 10px;
      color: #0a5545;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }

    .exam-button {
      padding: 18px 25px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background-color: #2ba98e;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .exam-button i {
      font-size: 1.4rem;
    }

    .exam-button:hover {
      background-color: #2ba98e;
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
    }

    .exam-button:active {
      transform: scale(0.97);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .especifica {
      background-color: rgb(43, 55, 226);
    }

    .especifica:hover {
      background-color: rgb(43, 55, 226);
    }

    @media (min-width: 600px) {
      .button-group {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      .exam-button {
        flex: 1 1 45%;
      }
    }
  </style>
</head>

<body>

  <script>
    function redirectTo(exam) {
      const urls = {
        ciencias: "#",
        vgfc: "#",
        logico: "https://forms.office.com/r/8wGKQUMK2h?origin=lprLink",
        logicoEspecifica: "https://forms.office.com/r/cDwBz5mwaW?origin=lprLink",
        toeic: "#",
        lenguaje: "#",
        software: "#",
        ciberseguridad: "https://forms.office.com/r/Y9zJJ7dWdD",
        electronica: "#",
        diseno: "#",
        logistica: "#"
      };
      const url = urls[exam];

      if (url) {
        window.open(url, "_blank"); // Abre en una nueva pestaña
      } else {
        alert("Examen no disponible.");
      }

    }
  </script>
