    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
      }

      header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 20px 10px 20px;
        background-color: #107c65;
      }

      header img {
        height: 100px;
        margin-bottom: 15px;
      }

      .titles {
        text-align: center;
        margin-top: 30px;
        margin-bottom: 20px;
        padding: 0 15px;
      }

      .titles h1 {
        font-size: 2.2rem;
        margin-bottom: 10px;
        color: #2ba98e;
      }

      .titles h2 {
        font-size: 1.4rem;
        color: #3a3a3a;
        font-weight: normal;
      }

      .section-title {
        text-align: center;
        font-size: 1.6rem;
        font-weight: bold;
        margin-top: 40px;
        margin-bottom: 10px;
        color: #0a5545;
        padding: 0 15px;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: calc(100vh - 130px);
        padding-bottom: 60px;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 600px;
        margin-top: 20px;
        padding: 0 20px;
        box-sizing: border-box;
      }

      .option-button {
        padding: 18px 25px;
        font-size: 1.3rem;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        background-color: #2ba98e;
        color: white;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.2s ease,
          background-color 0.3s ease,
          box-shadow 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .option-button i {
        font-size: 1.4rem;
      }

      .option-button:hover {
        background-color: #238f79;
        transform: scale(1.05);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
      }

      .option-button:active {
        transform: scale(0.97);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }

      @media (min-width: 600px) {
        .button-group {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
        }

        .option-button {
          flex: 1 1 45%;
        }
      }

      @media (max-width: 480px) {
        .titles h1 {
          font-size: 1.8rem;
        }

        .titles h2 {
          font-size: 1.1rem;
        }

        .section-title {
          font-size: 1.3rem;
        }

        .option-button {
          font-size: 1.1rem;
          padding: 16px 20px;
        }
      }
    </style>
  </head>
